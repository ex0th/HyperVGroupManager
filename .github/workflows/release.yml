name: Build GitHub release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build portable ZIP and MSI release
    runs-on: windows-latest
    environment: release

    env:
      PROJECT_PATH: src\HyperVGroupManager.App\HyperVGroupManager.App.csproj
      INSTALLER_PROJECT_PATH: installer\HyperVGroupManager.Installer.wixproj
      SOLUTION_PATH: HyperVGroupManager.sln

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Validate Artifact Signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $requiredSettings = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'ARTIFACT_SIGNING_ENDPOINT',
            'ARTIFACT_SIGNING_ACCOUNT_NAME',
            'ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME'
          )

          $missingSettings = @($requiredSettings | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missingSettings.Count -gt 0) {
            throw "Required GitHub environment settings are missing: $($missingSettings -join ', '). Unsigned releases are blocked."
          }

          $endpoint = $null
          if (-not [Uri]::TryCreate($env:ARTIFACT_SIGNING_ENDPOINT, [UriKind]::Absolute, [ref]$endpoint) -or
              $endpoint.Scheme -ne 'https') {
            throw 'ARTIFACT_SIGNING_ENDPOINT must be an absolute HTTPS URI.'
          }

      - name: Validate tag and project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not a supported release tag. Expected vMAJOR.MINOR.PATCH."
          }

          $version = $Matches.version
          [xml]$project = Get-Content -Raw -LiteralPath $env:PROJECT_PATH
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) {
            throw "No <Version> element was found in $env:PROJECT_PATH."
          }

          $projectVersion = $versionNode.InnerText.Trim()
          if ($projectVersion -ne $version) {
            throw "Tag version '$version' does not match project version '$projectVersion'."
          }

          $numericVersion = ($version -split '-', 2)[0]
          $versionParts = @($numericVersion -split '\.' | ForEach-Object { [int]$_ })
          if ($versionParts[0] -gt 255 -or $versionParts[1] -gt 255 -or $versionParts[2] -gt 65535) {
            throw "Version '$numericVersion' exceeds Windows Installer limits (255.255.65535)."
          }

          $expectedFileVersion = "$numericVersion.0"
          foreach ($elementName in @('AssemblyVersion', 'FileVersion')) {
            $node = $project.SelectSingleNode("/Project/PropertyGroup/$elementName")
            if ($null -eq $node -or $node.InnerText.Trim() -ne $expectedFileVersion) {
              $actualValue = if ($null -eq $node) { '<missing>' } else { $node.InnerText.Trim() }
              throw "Project $elementName '$actualValue' does not match '$expectedFileVersion'."
            }
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSI_PRODUCT_VERSION=$numericVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_FILE_VERSION=$expectedFileVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore $env:SOLUTION_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "Solution restore failed with exit code $LASTEXITCODE."
          }

          dotnet restore $env:INSTALLER_PROJECT_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "Installer restore failed with exit code $LASTEXITCODE."
          }

      - name: Run tests
        run: dotnet test $env:SOLUTION_PATH -c Release --no-restore

      - name: Publish portable application
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'HyperVGroupManager-publish'
          dotnet publish $env:PROJECT_PATH -c Release --no-restore -o $publishDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

          $executable = Join-Path $publishDirectory 'HyperVGroupManager.App.exe'
          if (-not (Test-Path -LiteralPath $executable)) {
            throw 'The published executable is missing.'
          }

          $publishedVersion = (Get-Item -LiteralPath $executable).VersionInfo.FileVersion
          if ($publishedVersion -ne $env:RELEASE_FILE_VERSION) {
            throw "Published file version '$publishedVersion' does not match '$env:RELEASE_FILE_VERSION'."
          }

          "PUBLISH_DIRECTORY=$publishDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLISHED_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign portable executable with Microsoft Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ env.PUBLISHED_EXECUTABLE }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Hyper-V VM Group Manager
          description-url: https://github.com/${{ github.repository }}

      - name: Verify portable executable signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:PUBLISHED_EXECUTABLE
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Portable executable signature is not valid: $($signature.Status) - $($signature.StatusMessage)"
          }

          Write-Host "Signed portable executable: $($signature.SignerCertificate.Subject)"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $installerOutput = Join-Path $env:RUNNER_TEMP 'HyperVGroupManager-installer'
          dotnet build $env:INSTALLER_PROJECT_PATH -c Release --no-restore `
            "-p:ProductVersion=$env:MSI_PRODUCT_VERSION" `
            "-p:PublishDir=$env:PUBLISH_DIRECTORY" `
            "-p:OutputPath=$installerOutput"
          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed with exit code $LASTEXITCODE."
          }

          $installers = @(Get-ChildItem -LiteralPath $installerOutput -Filter '*.msi' -Recurse -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI output, found $($installers.Count)."
          }

          "INSTALLER_SOURCE=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Windows installer with Microsoft Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ env.INSTALLER_SOURCE }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Hyper-V VM Group Manager
          description-url: https://github.com/${{ github.repository }}

      - name: Verify Windows installer signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:INSTALLER_SOURCE
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Windows installer signature is not valid: $($signature.Status) - $($signature.StatusMessage)"
          }

          Write-Host "Signed Windows installer: $($signature.SignerCertificate.Subject)"

      - name: Package release and checksums
        shell: pwsh
        run: |
          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null

          $archiveName = "HyperVGroupManager-$env:RELEASE_VERSION-win-x64.zip"
          $archivePath = Join-Path $assetDirectory $archiveName
          Compress-Archive -Path (Join-Path $env:PUBLISH_DIRECTORY '*') -DestinationPath $archivePath -CompressionLevel Optimal

          $installerName = "HyperVGroupManager-$env:RELEASE_VERSION-win-x64.msi"
          $installerPath = Join-Path $assetDirectory $installerName
          Copy-Item -LiteralPath $env:INSTALLER_SOURCE -Destination $installerPath

          $checksumPath = Join-Path $assetDirectory "HyperVGroupManager-$env:RELEASE_VERSION-SHA256SUMS.txt"
          @($archivePath, $installerPath) | ForEach-Object {
            $file = Get-Item -LiteralPath $_
            $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$checksum  $($file.Name)"
          } | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "RELEASE_ARCHIVE=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_INSTALLER=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUM=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $arguments = @(
            'release', 'create', '${{ github.ref_name }}',
            $env:RELEASE_ARCHIVE,
            $env:RELEASE_INSTALLER,
            $env:RELEASE_CHECKSUM,
            '--verify-tag',
            '--title', "Hyper-V VM Group Manager $env:RELEASE_VERSION",
            '--generate-notes'
          )

          if ($env:RELEASE_VERSION -match '-') {
            $arguments += '--prerelease'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
