name: Build GitHub release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish portable release
    runs-on: windows-latest

    env:
      PROJECT_PATH: src\HyperVGroupManager.App\HyperVGroupManager.App.csproj
      SOLUTION_PATH: HyperVGroupManager.sln

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate tag and project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not a supported release tag. Expected vMAJOR.MINOR.PATCH."
          }

          $version = $Matches.version
          [xml]$project = Get-Content -Raw -LiteralPath $env:PROJECT_PATH
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) {
            throw "No <Version> element was found in $env:PROJECT_PATH."
          }

          $projectVersion = $versionNode.InnerText.Trim()
          if ($projectVersion -ne $version) {
            throw "Tag version '$version' does not match project version '$projectVersion'."
          }

          $numericVersion = ($version -split '-', 2)[0]
          $expectedFileVersion = "$numericVersion.0"
          foreach ($elementName in @('AssemblyVersion', 'FileVersion')) {
            $node = $project.SelectSingleNode("/Project/PropertyGroup/$elementName")
            if ($null -eq $node -or $node.InnerText.Trim() -ne $expectedFileVersion) {
              $actualValue = if ($null -eq $node) { '<missing>' } else { $node.InnerText.Trim() }
              throw "Project $elementName '$actualValue' does not match '$expectedFileVersion'."
            }
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_FILE_VERSION=$expectedFileVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore dependencies
        run: dotnet restore $env:SOLUTION_PATH

      - name: Run tests
        run: dotnet test $env:SOLUTION_PATH -c Release --no-restore

      - name: Publish portable application
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'HyperVGroupManager-publish'
          dotnet publish $env:PROJECT_PATH -c Release --no-restore -o $publishDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

          $executable = Join-Path $publishDirectory 'HyperVGroupManager.App.exe'
          if (-not (Test-Path -LiteralPath $executable)) {
            throw 'The published executable is missing.'
          }

          $publishedVersion = (Get-Item -LiteralPath $executable).VersionInfo.FileVersion
          if ($publishedVersion -ne $env:RELEASE_FILE_VERSION) {
            throw "Published file version '$publishedVersion' does not match '$env:RELEASE_FILE_VERSION'."
          }

          "PUBLISH_DIRECTORY=$publishDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package release and checksum
        shell: pwsh
        run: |
          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null

          $archiveName = "HyperVGroupManager-$env:RELEASE_VERSION-win-x64.zip"
          $archivePath = Join-Path $assetDirectory $archiveName
          Compress-Archive -Path (Join-Path $env:PUBLISH_DIRECTORY '*') -DestinationPath $archivePath -CompressionLevel Optimal

          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          $checksumPath = "$archivePath.sha256"
          "$checksum  $archiveName" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "RELEASE_ARCHIVE=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUM=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $arguments = @(
            'release', 'create', '${{ github.ref_name }}',
            $env:RELEASE_ARCHIVE,
            $env:RELEASE_CHECKSUM,
            '--verify-tag',
            '--title', "Hyper-V VM Group Manager $env:RELEASE_VERSION",
            '--generate-notes'
          )

          if ($env:RELEASE_VERSION -match '-') {
            $arguments += '--prerelease'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
