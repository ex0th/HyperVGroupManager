name: Build GitHub release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build portable ZIP and MSI release
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release

    env:
      PROJECT_PATH: src\HyperVGroupManager.App\HyperVGroupManager.App.csproj
      INSTALLER_PROJECT_PATH: installer\HyperVGroupManager.Installer.wixproj
      SOLUTION_PATH: HyperVGroupManager.sln

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Select release signing mode
        id: signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CODE_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          $tagMessage = & git tag --list '${{ github.ref_name }}' --format='%(contents)'
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read the annotated release tag.'
          }

          $requestedMode = 'Auto'
          if (($tagMessage -join "`n") -match '(?im)^Signing-Mode:\s*(Auto|ArtifactSigning|Pfx)\s*$') {
            $requestedMode = $Matches[1]
          }

          $azureSettings = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'ARTIFACT_SIGNING_ENDPOINT',
            'ARTIFACT_SIGNING_ACCOUNT_NAME',
            'ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME'
          )
          $missingAzureSettings = @($azureSettings | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          $artifactSigningAvailable = $missingAzureSettings.Count -eq 0
          $pfxSigningAvailable = -not [string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERTIFICATE_BASE64)

          $mode = switch ($requestedMode) {
            'ArtifactSigning' {
              if (-not $artifactSigningAvailable) {
                throw "Artifact Signing was requested but required settings are missing: $($missingAzureSettings -join ', ')."
              }
              'artifact'
            }
            'Pfx' {
              if (-not $pfxSigningAvailable) {
                throw 'PFX signing was requested but CODE_SIGNING_CERTIFICATE_BASE64 is not configured.'
              }
              'pfx'
            }
            default {
              if ($artifactSigningAvailable) {
                'artifact'
              }
              elseif ($pfxSigningAvailable) {
                Write-Warning "Microsoft Artifact Signing is unavailable; falling back to a non-public PFX signature. Missing settings: $($missingAzureSettings -join ', ')."
                'pfx'
              }
              else {
                throw 'No signing method is configured. Configure Microsoft Artifact Signing or CODE_SIGNING_CERTIFICATE_BASE64.'
              }
            }
          }

          if ($mode -eq 'artifact') {
            $endpoint = $null
            if (-not [Uri]::TryCreate($env:ARTIFACT_SIGNING_ENDPOINT, [UriKind]::Absolute, [ref]$endpoint) -or
                $endpoint.Scheme -ne 'https') {
              throw 'ARTIFACT_SIGNING_ENDPOINT must be an absolute HTTPS URI.'
            }
          }

          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "SIGNING_MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Selected release signing mode: $mode (requested: $requestedMode)"

      - name: Prepare private PFX signing certificate
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.CODE_SIGNING_CERTIFICATE_BASE64 }}
          CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'HyperVGroupManager-CodeSigning.pfx'
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP 'HyperVGroupManager-CodeSigning.cer'
          "SIGNING_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_TRUST_CERTIFICATE_PATH=$publicCertificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          try {
            $certificateBytes = [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
          }
          catch {
            throw 'CODE_SIGNING_CERTIFICATE_BASE64 is not valid Base64.'
          }

          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          try {
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificatePath,
              $env:CODE_SIGNING_CERTIFICATE_PASSWORD,
              $flags)
          }
          catch {
            throw "The PFX could not be opened. Verify CODE_SIGNING_CERTIFICATE_PASSWORD. $($_.Exception.Message)"
          }

          if (-not $certificate.HasPrivateKey) {
            throw 'The configured PFX does not contain a private key.'
          }
          if ($certificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
            throw "The configured PFX expired on $($certificate.NotAfter.ToString('u'))."
          }

          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          $hasCodeSigningEku = @($certificate.Extensions |
            Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            Where-Object { $_.Value -eq $codeSigningOid }).Count -gt 0
          if (-not $hasCodeSigningEku) {
            throw 'The configured PFX is not valid for code signing.'
          }

          [IO.File]::WriteAllBytes(
            $publicCertificatePath,
            $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

          # The runner trusts the private certificate only for build-time verification. End-user
          # devices must receive this public certificate through their managed trust policy.
          # Import-Certificate prompts before adding a root certificate. That prompt is not
          # visible on a hosted runner and would leave the job waiting until its timeout.
          # The force flag makes certutil non-interactive; -Silent is intentionally omitted
          # because the addstore verb on windows-latest does not support that global option.
          & certutil.exe -user -f -addstore Root $publicCertificatePath
          if ($LASTEXITCODE -ne 0) {
            throw "The private signing certificate could not be added to the temporary trusted root store (certutil exit code $LASTEXITCODE)."
          }

          "SIGNING_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate tag and project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not a supported release tag. Expected vMAJOR.MINOR.PATCH."
          }

          $version = $Matches.version
          [xml]$project = Get-Content -Raw -LiteralPath $env:PROJECT_PATH
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) {
            throw "No <Version> element was found in $env:PROJECT_PATH."
          }

          $projectVersion = $versionNode.InnerText.Trim()
          if ($projectVersion -ne $version) {
            throw "Tag version '$version' does not match project version '$projectVersion'."
          }

          $numericVersion = ($version -split '-', 2)[0]
          $versionParts = @($numericVersion -split '\.' | ForEach-Object { [int]$_ })
          if ($versionParts[0] -gt 255 -or $versionParts[1] -gt 255 -or $versionParts[2] -gt 65535) {
            throw "Version '$numericVersion' exceeds Windows Installer limits (255.255.65535)."
          }

          $expectedFileVersion = "$numericVersion.0"
          foreach ($elementName in @('AssemblyVersion', 'FileVersion')) {
            $node = $project.SelectSingleNode("/Project/PropertyGroup/$elementName")
            if ($null -eq $node -or $node.InnerText.Trim() -ne $expectedFileVersion) {
              $actualValue = if ($null -eq $node) { '<missing>' } else { $node.InnerText.Trim() }
              throw "Project $elementName '$actualValue' does not match '$expectedFileVersion'."
            }
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSI_PRODUCT_VERSION=$numericVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_FILE_VERSION=$expectedFileVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore $env:SOLUTION_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "Solution restore failed with exit code $LASTEXITCODE."
          }

          dotnet restore $env:INSTALLER_PROJECT_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "Installer restore failed with exit code $LASTEXITCODE."
          }

      - name: Run tests
        run: dotnet test $env:SOLUTION_PATH -c Release --no-restore

      - name: Publish portable application
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'HyperVGroupManager-publish'
          dotnet publish $env:PROJECT_PATH -c Release --no-restore -o $publishDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

          $executable = Join-Path $publishDirectory 'HyperVGroupManager.App.exe'
          if (-not (Test-Path -LiteralPath $executable)) {
            throw 'The published executable is missing.'
          }

          $publishedVersion = (Get-Item -LiteralPath $executable).VersionInfo.FileVersion
          if ($publishedVersion -ne $env:RELEASE_FILE_VERSION) {
            throw "Published file version '$publishedVersion' does not match '$env:RELEASE_FILE_VERSION'."
          }

          "PUBLISH_DIRECTORY=$publishDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLISHED_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign in to Azure with GitHub OIDC
        if: steps.signing.outputs.mode == 'artifact'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign portable executable with Microsoft Artifact Signing
        if: steps.signing.outputs.mode == 'artifact'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ env.PUBLISHED_EXECUTABLE }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Hyper-V VM Group Manager
          description-url: https://github.com/${{ github.repository }}

      - name: Sign portable executable with private PFX
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          .\scripts\Sign-Release.ps1 `
            -Path $env:PUBLISHED_EXECUTABLE `
            -CertificatePath $env:SIGNING_CERTIFICATE_PATH

      - name: Verify portable executable signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:PUBLISHED_EXECUTABLE
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Portable executable signature is not valid: $($signature.Status) - $($signature.StatusMessage)"
          }

          Write-Host "Signed portable executable: $($signature.SignerCertificate.Subject)"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $installerOutput = Join-Path $env:RUNNER_TEMP 'HyperVGroupManager-installer'
          dotnet build $env:INSTALLER_PROJECT_PATH -c Release --no-restore `
            "-p:ProductVersion=$env:MSI_PRODUCT_VERSION" `
            "-p:PublishDir=$env:PUBLISH_DIRECTORY" `
            "-p:OutputPath=$installerOutput"
          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed with exit code $LASTEXITCODE."
          }

          $installers = @(Get-ChildItem -LiteralPath $installerOutput -Filter '*.msi' -Recurse -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI output, found $($installers.Count)."
          }

          "INSTALLER_SOURCE=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Windows installer with Microsoft Artifact Signing
        if: steps.signing.outputs.mode == 'artifact'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ env.INSTALLER_SOURCE }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Hyper-V VM Group Manager
          description-url: https://github.com/${{ github.repository }}

      - name: Sign Windows installer with private PFX
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          .\scripts\Sign-Release.ps1 `
            -Path $env:INSTALLER_SOURCE `
            -CertificatePath $env:SIGNING_CERTIFICATE_PATH

      - name: Verify Windows installer signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:INSTALLER_SOURCE
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Windows installer signature is not valid: $($signature.Status) - $($signature.StatusMessage)"
          }

          Write-Host "Signed Windows installer: $($signature.SignerCertificate.Subject)"

      - name: Package release and checksums
        shell: pwsh
        run: |
          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null

          $archiveName = "HyperVGroupManager-$env:RELEASE_VERSION-win-x64.zip"
          $archivePath = Join-Path $assetDirectory $archiveName
          Compress-Archive -Path (Join-Path $env:PUBLISH_DIRECTORY '*') -DestinationPath $archivePath -CompressionLevel Optimal

          $installerName = "HyperVGroupManager-$env:RELEASE_VERSION-win-x64.msi"
          $installerPath = Join-Path $assetDirectory $installerName
          Copy-Item -LiteralPath $env:INSTALLER_SOURCE -Destination $installerPath

          $signature = Get-AuthenticodeSignature -LiteralPath $env:INSTALLER_SOURCE
          $certificateName = "HyperVGroupManager-$env:RELEASE_VERSION-CodeSigning.cer"
          $certificatePath = Join-Path $assetDirectory $certificateName
          [IO.File]::WriteAllBytes(
            $certificatePath,
            $signature.SignerCertificate.Export(
              [System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

          $signingInfoPath = Join-Path $assetDirectory "HyperVGroupManager-$env:RELEASE_VERSION-SIGNING.txt"
          $trustDescription = if ($env:SIGNING_MODE -eq 'artifact') {
            'Public Trust through Microsoft Azure Artifact Signing.'
          }
          else {
            'Private/self-signed certificate. Windows does not trust this signature by default. Deploy and trust the included public certificate only after verifying its SHA-256 fingerprint through a separate trusted channel.'
          }
          @(
            "Signing mode: $env:SIGNING_MODE",
            "Trust: $trustDescription",
            "Subject: $($signature.SignerCertificate.Subject)",
            "Issuer: $($signature.SignerCertificate.Issuer)",
            "Certificate thumbprint (SHA-1 identifier): $($signature.SignerCertificate.Thumbprint)",
            "Certificate SHA-256: $((Get-FileHash -Algorithm SHA256 -LiteralPath $certificatePath).Hash.ToLowerInvariant())",
            "Timestamp subject: $($signature.TimeStamperCertificate.Subject)"
          ) | Set-Content -LiteralPath $signingInfoPath -Encoding utf8

          $checksumPath = Join-Path $assetDirectory "HyperVGroupManager-$env:RELEASE_VERSION-SHA256SUMS.txt"
          @($archivePath, $installerPath, $certificatePath, $signingInfoPath) | ForEach-Object {
            $file = Get-Item -LiteralPath $_
            $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$checksum  $($file.Name)"
          } | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "RELEASE_ARCHIVE=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_INSTALLER=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CERTIFICATE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SIGNING_INFO=$signingInfoPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUM=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $arguments = @(
            'release', 'create', '${{ github.ref_name }}',
            $env:RELEASE_ARCHIVE,
            $env:RELEASE_INSTALLER,
            $env:RELEASE_CERTIFICATE,
            $env:RELEASE_SIGNING_INFO,
            $env:RELEASE_CHECKSUM,
            '--verify-tag',
            '--title', "Hyper-V VM Group Manager $env:RELEASE_VERSION$(if ($env:SIGNING_MODE -eq 'pfx') { ' (private signature)' })",
            '--generate-notes'
          )

          if ($env:RELEASE_VERSION -match '-') {
            $arguments += '--prerelease'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }

      - name: Remove temporary private signing material and trust
        if: always() && steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_THUMBPRINT)) {
            $trustedCertificate = Join-Path 'Cert:\CurrentUser\Root' $env:SIGNING_CERTIFICATE_THUMBPRINT
            if (Test-Path -LiteralPath $trustedCertificate) {
              Remove-Item -LiteralPath $trustedCertificate -Force
            }
          }

          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PATH) -and
              (Test-Path -LiteralPath $env:SIGNING_CERTIFICATE_PATH)) {
            [IO.File]::Delete($env:SIGNING_CERTIFICATE_PATH)
          }

          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_TRUST_CERTIFICATE_PATH) -and
              (Test-Path -LiteralPath $env:SIGNING_TRUST_CERTIFICATE_PATH)) {
            [IO.File]::Delete($env:SIGNING_TRUST_CERTIFICATE_PATH)
          }
